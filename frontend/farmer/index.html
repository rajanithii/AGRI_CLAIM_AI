<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CropSure AI - Farmer Portal</title>
    <style>
      :root {
        --green: #2d6a4f;
        --light: #edf8f0;
        --text: #1b2d1f;
        --muted: #5f7568;
        --card: #ffffff;
        --border: #dfeee3;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f2fbf4, #ebf6ee);
        color: var(--text);
      }
      .container {
        max-width: 980px;
        margin: 0 auto;
        padding: 40px 20px 80px;
      }
      .header {
        background: linear-gradient(135deg, var(--green), #40916c);
        color: white;
        padding: 32px 20px;
        border-radius: 20px;
        box-shadow: 0 12px 30px rgba(45, 106, 79, 0.18);
      }
      .header h1 { margin: 0 0 8px; font-size: 2.2rem; }
      .header p { margin: 0; opacity: 0.9; }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        margin-top: 25px;
        padding: 24px;
        box-shadow: 0 8px 18px rgba(20, 30, 20, 0.05);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 18px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      label {
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }
      input, select, textarea {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #dfeae3;
        border-radius: 10px;
        font-size: 1rem;
      }
      textarea {
        min-height: 100px;
        resize: vertical;
      }
      .button {
        margin-top: 18px;
        padding: 14px 22px;
        border: none;
        border-radius: 12px;
        background: var(--green);
        color: white;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }
      .status {
        padding: 10px 14px;
        border-radius: 10px;
        background: var(--light);
        border: 1px solid var(--border);
        color: var(--muted);
        margin-top: 18px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>Farmer Portal</h1>
        <p>Submit crop damage claims and upload field evidence for AI-based assessment.</p>
      </header>

      <section class="card">
        <div class="grid">
          <div class="field">
            <label for="name">Farmer Name</label>
            <input id="name" type="text" placeholder="Enter farmer name" />
          </div>
          <div class="field">
            <label for="phone">Phone Number</label>
            <input id="phone" type="tel" placeholder="Enter phone number" />
          </div>
          <div class="field">
            <label for="crop">Crop</label>
            <select id="crop">
              <option>Rice</option>
              <option>Cotton</option>
              <option>Wheat</option>
              <option>Maize</option>
              <option>Groundnut</option>
            </select>
          </div>
          <div class="field">
            <label for="district">District</label>
            <input id="district" type="text" placeholder="Enter district" />
          </div>
          <div class="field">
            <label for="area">Land Area (acres)</label>
            <input id="area" type="number" min="0" step="0.1" placeholder="e.g. 5.5" />
          </div>
          <div class="field">
            <label for="image">Crop Photo</label>
            <input id="image" type="file" accept="image/*" />
          </div>
        </div>

        <div class="field" style="margin-top: 18px;">
          <label for="damage">Damage Details</label>
          <textarea id="damage" placeholder="Describe the crop condition or damage observed..."></textarea>
        </div>

        <button class="button" type="button">Submit Claim</button>
        <div class="status">This page is the farmer-facing interface for the CropSure AI project.</div>
      </section>
    </div>
  </body>
</html>
