<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" role="img" aria-label="Claim processing pipeline" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .t{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#1f3d2e;font-weight:700}
    .s{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#5f7568}
    .flow{stroke:#7b9a68;stroke-width:2;stroke-dasharray:6 6;animation:dash 1.6s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-24}}
  </style>
  <rect width="1200" height="190" rx="14" fill="#f7f2e7"/>
  <g>
    <rect x="30"  y="55" width="170" height="80" rx="12" fill="#fff" stroke="#cfdcc2"/>
    <text class="t" x="115" y="90" text-anchor="middle">Claim + Image</text><text class="s" x="115" y="112" text-anchor="middle">multer upload</text>
    <rect x="250" y="55" width="170" height="80" rx="12" fill="#fff" stroke="#cfdcc2"/>
    <text class="t" x="335" y="90" text-anchor="middle">vision.js</text><text class="s" x="335" y="112" text-anchor="middle">simulated severity</text>
    <rect x="470" y="55" width="170" height="80" rx="12" fill="#fff" stroke="#cfdcc2"/>
    <text class="t" x="555" y="90" text-anchor="middle">llm.js</text><text class="s" x="555" y="112" text-anchor="middle">Groq / OpenAI / mock</text>
    <rect x="690" y="55" width="170" height="80" rx="12" fill="#fff" stroke="#cfdcc2"/>
    <text class="t" x="775" y="90" text-anchor="middle">Priority score</text><text class="s" x="775" y="112" text-anchor="middle">weighted 0–100</text>
    <rect x="910" y="55" width="170" height="80" rx="12" fill="#2d6a4f"/>
    <text class="t" x="995" y="90" text-anchor="middle" style="fill:#fff">Admin review</text><text class="s" x="995" y="112" text-anchor="middle" style="fill:#d6e6da">status + SMS</text>
  </g>
  <g class="flow" fill="none">
    <path d="M200 95 H250"/><path d="M420 95 H470"/><path d="M640 95 H690"/><path d="M860 95 H910"/>
  </g>
</svg>
